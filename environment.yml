name: b-magent
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      # Core numerical stack. Keep these pinned together for binary compatibility.
      - numpy==1.26.4
      - scipy==1.13.1
      - scikit-learn==1.5.2

      # Qwen inference and LoRA training.
      - torch==2.8.0
      - torchvision==0.23.0
      - transformers==4.51.3
      - tokenizers==0.21.4
      - accelerate==1.14.0
      - datasets==2.20.0
      - peft==0.12.0
      - bitsandbytes==0.49.2
      - safetensors==0.8.0
      - sentencepiece==0.2.1

      # Project utilities and tests.
      - tensorboard==2.20.0
      - pytest==9.1.1
